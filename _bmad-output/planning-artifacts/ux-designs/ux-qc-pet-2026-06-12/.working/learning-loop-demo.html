<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QC Pet — Learning Loop Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1A2340;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, sans-serif;
    padding: 24px;
    gap: 24px;
  }

  /* Header */
  .header {
    text-align: center;
  }
  .header h1 {
    color: #fff;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header p {
    color: #8899BB;
    font-size: 13px;
    margin-top: 4px;
  }

  /* Flow steps */
  .flow-steps {
    display: flex;
    align-items: center;
    gap: 0;
  }
  .step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.3s;
  }
  .step.active { opacity: 1; }
  .step.done { opacity: 0.7; }
  .step-dot {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: #2D3A5A;
    border: 2px solid #3D4E6E;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    transition: all 0.3s;
    position: relative;
    z-index: 1;
  }
  .step.active .step-dot {
    background: #FFE082;
    border-color: #FFE082;
    box-shadow: 0 0 12px rgba(255,224,130,0.5);
  }
  .step.done .step-dot {
    background: #00C9B1;
    border-color: #00C9B1;
  }
  .step-label {
    font-size: 10px;
    color: #8899BB;
    text-align: center;
    max-width: 70px;
    line-height: 1.3;
    font-weight: 500;
  }
  .step.active .step-label { color: #FFE082; font-weight: 700; }
  .step.done .step-label { color: #00C9B1; }

  .step-connector {
    width: 40px;
    height: 2px;
    background: #2D3A5A;
    margin-bottom: 20px;
    transition: background 0.3s;
  }
  .step-connector.done { background: #00C9B1; }

  /* Phone frame */
  .phone-wrapper {
    position: relative;
  }
  .phone-frame {
    width: 320px;
    height: 640px;
    background: #0D1425;
    border-radius: 44px;
    border: 3px solid #3D4E6E;
    box-shadow:
      0 0 0 1px #0D1425,
      0 30px 80px rgba(0,0,0,0.6),
      inset 0 1px 0 rgba(255,255,255,0.05);
    position: relative;
    overflow: hidden;
  }

  /* Notch */
  .phone-frame::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100px;
    height: 28px;
    background: #0D1425;
    border-radius: 0 0 18px 18px;
    z-index: 10;
  }

  /* Screen slides */
  .screen-container {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
    border-radius: 41px;
  }

  .screen {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .screen::-webkit-scrollbar { display: none; }
  .screen.active {
    opacity: 1;
    pointer-events: auto;
  }

  .screen img {
    width: 100%;
    display: block;
    object-fit: cover;
    object-position: top;
  }

  /* Tap overlay */
  .tap-overlay {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 120px;
    background: linear-gradient(transparent, rgba(0,0,0,0.7));
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 20px;
    cursor: pointer;
    z-index: 5;
    transition: opacity 0.3s;
  }
  .tap-overlay:hover { opacity: 0.9; }
  .tap-hint {
    color: rgba(255,255,255,0.85);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .tap-hint svg { animation: bounce-right 1s infinite; }

  /* Last screen — no next hint */
  .tap-overlay.is-last .tap-hint::after {
    content: '';
  }

  @keyframes bounce-right {
    0%, 100% { transform: translateX(0); }
    50% { transform: translateX(4px); }
  }

  /* Controls */
  .controls {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .btn {
    padding: 10px 24px;
    border-radius: 999px;
    border: none;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: 0.3px;
  }
  .btn-prev {
    background: #2D3A5A;
    color: #8899BB;
    border: 1.5px solid #3D4E6E;
  }
  .btn-prev:hover { background: #3D4E6E; color: #fff; }
  .btn-next {
    background: #FFE082;
    color: #1A2340;
    box-shadow: 0 4px 0 #B8960A;
  }
  .btn-next:hover { transform: translateY(-1px); box-shadow: 0 5px 0 #B8960A; }
  .btn-next:active { transform: translateY(2px); box-shadow: 0 2px 0 #B8960A; }
  .btn-restart {
    background: #00C9B1;
    color: #0D1425;
    box-shadow: 0 4px 0 #008A7A;
  }
  .btn-restart:hover { transform: translateY(-1px); box-shadow: 0 5px 0 #008A7A; }

  /* Step description */
  .step-desc {
    background: #1E2D4A;
    border: 1.5px solid #2D3A5A;
    border-radius: 12px;
    padding: 12px 18px;
    max-width: 320px;
    text-align: center;
  }
  .step-desc .step-num {
    font-size: 10px;
    color: #00C9B1;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .step-desc .step-title {
    font-size: 14px;
    color: #fff;
    font-weight: 700;
    margin-bottom: 3px;
  }
  .step-desc .step-body {
    font-size: 11px;
    color: #8899BB;
    line-height: 1.5;
  }

  /* Counter */
  .counter {
    font-size: 11px;
    color: #3D4E6E;
    text-align: center;
  }
</style>
</head>
<body>

<div class="header">
  <h1>🐣 QC Pet — Learning Loop</h1>
  <p>Click màn hình hoặc nút → để xem flow</p>
</div>

<!-- Flow steps indicator -->
<div class="flow-steps" id="flowSteps">
  <div class="step active" onclick="goTo(0)" title="Work Room">
    <div class="step-dot">🏢</div>
    <div class="step-label">Work Room</div>
  </div>
  <div class="step-connector" id="conn0"></div>
  <div class="step active" onclick="goTo(1)" title="Core Mission">
    <div class="step-dot">🐛</div>
    <div class="step-label">Core Mission</div>
  </div>
  <div class="step-connector" id="conn1"></div>
  <div class="step" onclick="goTo(2)" title="Quiz">
    <div class="step-dot">❓</div>
    <div class="step-label">Quiz</div>
  </div>
  <div class="step-connector" id="conn2"></div>
  <div class="step" onclick="goTo(3)" title="Feedback">
    <div class="step-dot">✨</div>
    <div class="step-label">Story-Rule</div>
  </div>
  <div class="step-connector" id="conn3"></div>
  <div class="step" onclick="goTo(4)" title="Sprint Card">
    <div class="step-dot">📊</div>
    <div class="step-label">Sprint Card</div>
  </div>
</div>

<!-- Phone -->
<div class="phone-wrapper">
  <div class="phone-frame">
    <div class="screen-container" id="screenContainer">

      <!-- Screen 0: Work Room -->
      <div class="screen active" id="screen-0">
        <img src="../imports/stitch-output/m_n_h_nh_ch_nh_home/screen.png" alt="Work Room">
      </div>

      <!-- Screen 1: Core Mission entry (Aha Moment Pass/Fail) -->
      <div class="screen" id="screen-1">
        <img src="../imports/stitch-output/aha_moment_first_lesson/screen.png" alt="Core Mission">
      </div>

      <!-- Screen 2: Quiz MCQ -->
      <div class="screen" id="screen-2">
        <img src="../imports/stitch-output/nhi_m_v_h_ng_ng_y/screen.png" alt="Quiz">
      </div>

      <!-- Screen 3: Story-Rule Feedback -->
      <div class="screen" id="screen-3">
        <img src="../imports/stitch-output/aha_moment/screen.png" alt="Story-Rule Feedback" style="object-position: bottom;">
      </div>

      <!-- Screen 4: Sprint Demo Card -->
      <div class="screen" id="screen-4">
        <img src="../imports/stitch-output/sprint_demo_card_shareable/screen.png" alt="Sprint Demo Card">
      </div>

      <!-- Tap overlay -->
      <div class="tap-overlay" id="tapOverlay" onclick="nextScreen()">
        <div class="tap-hint">
          Chạm để tiếp tục
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M3 7h8M7 3l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Step description -->
<div class="step-desc" id="stepDesc">
  <div class="step-num" id="descNum">Bước 1 / 5</div>
  <div class="step-title" id="descTitle">Work Room — Phòng Làm Việc</div>
  <div class="step-body" id="descBody">Linh mở app thấy Bugsy đang làm việc. 4 Need Bars hiện trạng thái. Tap "Mission" để bắt đầu bài học hôm nay.</div>
</div>

<!-- Controls -->
<div class="controls">
  <button class="btn btn-prev" onclick="prevScreen()">← Quay lại</button>
  <button class="btn btn-next" id="btnNext" onclick="nextScreen()">Tiếp theo →</button>
</div>

<div class="counter" id="counter">1 / 5</div>

<script>
const SCREENS = [
  {
    num: "Bước 1 / 5",
    title: "Work Room — Phòng Làm Việc",
    body: "Linh mở app thấy Bugsy đang làm việc. 4 Need Bars hiện trạng thái. Tap \"Mission\" để bắt đầu bài học hôm nay."
  },
  {
    num: "Bước 2 / 5",
    title: "Core Mission — Warm-up Scenario",
    body: "Bugsy đói, hỏi Linh về bug đầu tiên. Bug report thật từ công việc hiện ra — Linh chọn PASS hoặc FAIL."
  },
  {
    num: "Bước 3 / 5",
    title: "Core Mission — Quiz (8 câu)",
    body: "Framework 2-5-1-2: 8 câu theo emotional arc. Câu này phân loại lỗi logic — Logic Error / Visual Glitch / Performance Lag."
  },
  {
    num: "Bước 4 / 5",
    title: "Story-Rule Feedback",
    body: "Sau mỗi câu: Bugsy kể chuyện ngắn → Rule landing. \"Tuyệt vời! Đây là Edge Case...\" → TEST RULE #1 xuất hiện."
  },
  {
    num: "Bước 5 / 5",
    title: "Sprint Demo Card — Kết thúc Sprint",
    body: "Cuối 7 ngày: card tóm tắt QP earned + Bug Coins + Streak tự động tạo. Linh share lên mạng xã hội. Bugsy nhảy."
  }
];

let current = 0;
const total = SCREENS.length;

function goTo(idx) {
  if (idx < 0 || idx >= total) return;

  // Update screens
  document.querySelectorAll('.screen').forEach((s, i) => {
    s.classList.toggle('active', i === idx);
  });

  // Update step indicators
  const steps = document.querySelectorAll('.step');
  steps.forEach((s, i) => {
    s.classList.remove('active', 'done');
    if (i === idx) s.classList.add('active');
    else if (i < idx) s.classList.add('done');
  });

  // Update connectors
  document.querySelectorAll('.step-connector').forEach((c, i) => {
    c.classList.toggle('done', i < idx);
  });

  // Update description
  document.getElementById('descNum').textContent = SCREENS[idx].num;
  document.getElementById('descTitle').textContent = SCREENS[idx].title;
  document.getElementById('descBody').textContent = SCREENS[idx].body;

  // Update counter
  document.getElementById('counter').textContent = `${idx + 1} / ${total}`;

  // Update next button
  const btnNext = document.getElementById('btnNext');
  const tapOverlay = document.getElementById('tapOverlay');
  if (idx === total - 1) {
    btnNext.textContent = '🔄 Xem lại';
    btnNext.className = 'btn btn-restart';
    tapOverlay.querySelector('.tap-hint').innerHTML = `
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M2 7a5 5 0 1 0 5-5" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
        <path d="M7 2L5 4l2 2" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Xem lại từ đầu
    `;
  } else {
    btnNext.textContent = 'Tiếp theo →';
    btnNext.className = 'btn btn-next';
    tapOverlay.querySelector('.tap-hint').innerHTML = `
      Chạm để tiếp tục
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
        <path d="M3 7h8M7 3l4 4-4 4" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    `;
  }

  current = idx;
}

function nextScreen() {
  if (current === total - 1) goTo(0);
  else goTo(current + 1);
}

function prevScreen() {
  if (current > 0) goTo(current - 1);
}

// Keyboard navigation
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); nextScreen(); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); prevScreen(); }
});

// Init
goTo(0);
</script>
</body>
</html>
