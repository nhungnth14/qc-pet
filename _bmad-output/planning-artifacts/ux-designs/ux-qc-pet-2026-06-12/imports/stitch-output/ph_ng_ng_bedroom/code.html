<style>
        body {
            background-color: #ECEEFF;
            font-family: 'Nunito Sans', sans-serif;
            overflow-x: hidden;
        }

        .kawaii-shadow {
            box-shadow: 4px 4px 0px 0px rgba(0, 0, 0, 1);
        }

        .kawaii-shadow-sm {
            box-shadow: 2px 2px 0px 0px rgba(0, 0, 0, 1);
        }

        .kawaii-border {
            border: 3px solid #000000;
        }

        .kawaii-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px 0px rgba(0, 0, 0, 1);
        }

        .sheen {
            position: absolute;
            top: 4px;
            left: 10%;
            width: 80%;
            height: 20%;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 9999px;
            pointer-events: none;
        }

        .night-mode-overlay {
            position: fixed;
            inset: 0;
            background: rgba(16, 32, 0, 0.4);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 40;
        }

        .night-active .night-mode-overlay {
            opacity: 1;
        }

        .floating {
            animation: floating 3s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .progress-liquid {
            background: linear-gradient(90deg, #7ecc00 0%, #a1fa29 100%);
            position: relative;
        }
        .progress-liquid::after {
            content: '';
            position: absolute;
            top: 4px;
            right: 4px;
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
        }
    </style>

</div>

</header>
<main class="flex-1 mt-16 pb-24 px-margin-mobile relative overflow-hidden flex flex-col items-center justify-center">
<!-- Constellation Background Elements -->

<span class="material-symbols-outlined text-primary text-4xl" data-icon="star">star</span>
</div>
<div class="absolute top-32 right-12 opacity-30 floating" style="animation-delay: 1s;">
<span class="material-symbols-outlined text-secondary text-2xl" data-icon="auto_awesome">auto_awesome</span>
</div>
<div class="absolute bottom-40 left-16 opacity-30 floating" style="animation-delay: 2s;">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="star_half">star_half</span>
</div>
</div>
<!-- Room Scene Container -->
<div class="relative w-full max-w-lg aspect-square flex items-end justify-center">
<!-- Bookshelf Left -->
<div class="absolute left-0 bottom-4 w-24 h-48 bg-primary-fixed kawaii-border rounded-lg kawaii-shadow flex flex-col p-2 gap-2">
<div class="w-full h-4 bg-primary-container rounded-sm kawaii-border border-0 kawaii-shadow-sm opacity-50"></div>

</div>
</div>

<div class="relative flex justify-center">

<!-- The Bed -->
<div class="relative w-full h-40 bg-[#c5b4e3] kawaii-border rounded-t-3xl kawaii-shadow mx-8 flex flex-col">

<div class="absolute -top-4 -right-4 flex flex-col gap-1 text-primary opacity-60 font-bold">
<span class="text-xs animate-bounce" style="animation-delay: 0.2s">Z</span>
<span class="text-sm animate-bounce" style="animation-delay: 0.5s">Z</span>

</div>
</div>
</div>

<span class="font-label-md text-label-md">Play</span>
</div>

<span class="material-symbols-outlined" data-icon="fitness_center">fitness_center</span>
<span class="font-label-md text-label-md">Train</span>
</div>

<script>
        let isNight = false;
        
        function toggleLight() {
            isNight = !isNight;
            const body = document.body;
            const overlay = document.getElementById('night-overlay');
            const lampLight = document.getElementById('lamp-light');
            const lightIcon = document.getElementById('light-icon');
            const lightText = document.getElementById('light-text');

            if (isNight) {
                body.classList.add('night-active');
                lampLight.style.opacity = '0';
                lightIcon.innerText = 'light_mode';
                lightText.innerText = 'Bật đèn';
            } else {
                body.classList.remove('night-active');
                lampLight.style.opacity = '0.6';
                lightIcon.innerText = 'nightlight';
                lightText.innerText = 'Tắt đèn';
            }
        }
    </script>
