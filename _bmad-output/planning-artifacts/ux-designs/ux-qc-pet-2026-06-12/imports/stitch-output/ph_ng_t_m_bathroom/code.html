<script>
        // Micro-interactions for the sink
        const sinkArea = document.querySelector('.w-40.h-10.bg-surface-container');
        sinkArea.addEventListener('click', () => {
            // Create bubble effects
            for(let i=0; i<5; i++) {
                const bubble = document.createElement('div');
                bubble.className = 'fixed bg-white border-[1px] border-black rounded-full pointer-events-none z-50';
                bubble.style.width = Math.random() * 20 + 10 + 'px';
                bubble.style.height = bubble.style.width;
                bubble.style.left = (event.clientX - 10) + 'px';
                bubble.style.top = (event.clientY - 10) + 'px';
                
                document.body.appendChild(bubble);
                
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 100 + 50;
                
                bubble.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${Math.cos(angle) * dist}px, ${-dist}px) scale(0)`, opacity: 0 }
                ], {
                    duration: 1000,
                    easing: 'ease-out'
                }).onfinish = () => bubble.remove();
            }
        });
    </script>
