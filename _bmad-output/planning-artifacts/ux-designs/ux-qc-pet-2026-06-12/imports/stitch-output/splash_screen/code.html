<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    
    .tactile-card {
      border: 3px solid #001a41;
      box-shadow: 0px 6px 0px 0px rgba(0, 26, 65, 1);
    }

    .tactile-button {
      border: 3px solid #001a41;
      box-shadow: 0px 4px 0px 0px rgba(0, 26, 65, 1);
      transition: all 0.1s ease;
    }

    .tactile-button:active {
      transform: translateY(2px);
      box-shadow: 0px 2px 0px 0px rgba(0, 26, 65, 1);
    }

    @keyframes pulse-text {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(0.98); }
    }
    .animate-pulse-slow {
      animation: pulse-text 2s infinite ease-in-out;
    }

    .bg-golden-hour {
      background: linear-gradient(180deg, #ffb4a5 0%, #c9e6ff 100%);
    }

    .window-glow {
      box-shadow: inset 0 0 15px rgba(255, 218, 211, 0.8);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-surface font-body-md text-on-surface overflow-hidden">
<!-- Splash Screen Container -->
<main class="relative h-screen w-full flex flex-col items-center justify-center bg-golden-hour px-container-padding overflow-hidden">
<!-- Environment Background Elements -->
<div class="absolute bottom-0 w-full h-[265px] bg-surface-container opacity-50 z-0"></div>
<!-- Hero Building Illustration -->
<div class="relative z-10 w-full max-w-lg mb-md">
<!-- 3D Office Building Representation -->
<div class="relative mx-auto w-64 md:w-80 h-80 md:h-96 bg-secondary-fixed tactile-card rounded-xl flex flex-col overflow-hidden">
<!-- Roof Section -->
<div class="h-12 bg-secondary border-b-4 border-on-background w-full"></div>
<!-- Windows Grid -->
<div class="flex-grow p-md grid grid-cols-2 gap-sm bg-secondary-fixed">
<div class="bg-tertiary-fixed rounded-lg tactile-card window-glow"></div>
<div class="bg-tertiary-fixed rounded-lg tactile-card window-glow"></div>
<div class="bg-tertiary-fixed rounded-lg tactile-card window-glow"></div>
<div class="bg-tertiary-fixed rounded-lg tactile-card window-glow"></div>
</div>
<!-- Main Building Entrance -->
<div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-20 h-24 bg-on-background rounded-t-lg flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed" style="font-size: 32px;">meeting_room</span>
</div>
</div>
<!-- Character Floating Element (Reference the pet ball from image prompt context) -->
<div class="absolute -bottom-8 -right-4 w-32 h-32 animate-bounce transition-transform duration-1000">
<img alt="Bugsy the tester" class="w-full h-full object-contain drop-shadow-[0_10px_10px_rgba(0,26,65,0.3)]" data-alt="A chubby, round 3D animated yellow chick wearing large purple headphones. The character has sparkly black eyes, orange rosy cheeks, and tiny orange feet. It is rendered in a soft, squishy plastic style with clean studio lighting on a pure white background, embodying a playful tech mascot aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCoO3NSW7_VzdfjxsQsjRgnCUzG40MZZOK85-45xitmuEv6TC5gSWVJjyLLGCk6iekg-I2GpnsYKE9zB2hQVdj3YVklAh2MbfcvZuvoiDW46uRT947fUoUkaY9bmyycVGj8baQ9DUs7bBqoEerAhfIre3J0UqwHjfzl2oVYbgNhGEfNF5JiXtanVGzCRhUmFtHwZVUdgkDrwVbVA3coHMLtbU690xYoXnjXJFdn_AJO0f0Uotw1pcI3TTdE_n5TCMcdOuTtXAKwZhdi"/>
</div>
</div>
<!-- Identity Section -->
<div class="relative z-20 flex flex-col items-center text-center">
<!-- Logo Branding -->
<div class="flex items-center gap-xs mb-sm">
<div class="bg-primary-container p-sm rounded-full tactile-card">
<span class="material-symbols-outlined text-on-primary-container" style="font-variation-settings: 'FILL' 1;">bug_report</span>
</div>
<h1 class="font-display text-display text-on-background tracking-tight">QC Pet</h1>
</div>
<!-- Tagline -->
<div class="bg-surface/80 backdrop-blur-sm px-md py-sm rounded-full border-2 border-on-background mb-lg">
<p class="font-ui-button text-ui-button text-on-background">Pet bạn đói. Đi tìm bug đi.</p>
</div>
<!-- Interaction Hint -->
<button class="group flex flex-col items-center gap-base mt-lg focus:outline-none" onclick="window.location.reload()">
<div class="animate-pulse-slow font-ui-button text-ui-button text-on-surface-variant flex flex-col items-center">
<span class="mb-xs">Tap to start</span>
<div class="w-12 h-12 bg-primary text-on-primary rounded-full flex items-center justify-center tactile-button group-hover:scale-110">
<span class="material-symbols-outlined">play_arrow</span>
</div>
</div>
</button>
</div>
<!-- Decorative Office Elements -->
<div class="absolute top-10 left-10 opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-[60px] text-on-background">cloud</span>
</div>
<div class="absolute top-32 right-12 opacity-20 pointer-events-none">
<span class="material-symbols-outlined text-[40px] text-on-background">cloud</span>
</div>
<div class="absolute bottom-20 left-12 opacity-10 pointer-events-none">
<span class="material-symbols-outlined text-[120px] text-on-background">corporate_fare</span>
</div>
</main>
<!-- Interactive Sparkle Script -->
<script>
    document.addEventListener('click', (e) => {
      const sparkle = document.createElement('div');
      sparkle.className = 'absolute pointer-events-none z-50 text-tertiary';
      sparkle.style.left = `${e.clientX}px`;
      sparkle.style.top = `${e.clientY}px`;
      sparkle.innerHTML = '<span class="material-symbols-outlined" style="font-variation-settings: \'FILL\' 1;">auto_awesome</span>';
      document.body.appendChild(sparkle);
      
      const anim = sparkle.animate([
        { transform: 'translate(-50%, -50%) scale(0) rotate(0deg)', opacity: 1 },
        { transform: 'translate(-50%, -150%) scale(1.5) rotate(45deg)', opacity: 0 }
      ], { duration: 800, easing: 'ease-out' });

      anim.onfinish = () => sparkle.remove();
    });
  </script>
