<script>
        // Micro-interaction: Scale rooms slightly when tapped
        document.querySelectorAll('.cursor-pointer').forEach(room => {
            room.addEventListener('mousedown', () => {
                room.querySelector('.neo-brutalist-card, .room-glow').style.transform = 'scale(0.98)';
            });
            room.addEventListener('mouseup', () => {
                room.querySelector('.neo-brutalist-card, .room-glow').style.transform = 'scale(1)';
            });
