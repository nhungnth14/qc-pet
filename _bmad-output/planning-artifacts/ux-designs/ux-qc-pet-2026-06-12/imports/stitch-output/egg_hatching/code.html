<style>
        @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }
        @keyframes bounce-custom {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        @keyframes pulse-glow {
            0%, 100% { filter: drop-shadow(0 0 10px rgba(34, 181, 255, 0.6)); }
            50% { filter: drop-shadow(0 0 25px rgba(34, 181, 255, 0.9)); }
        }
        .egg-shake { animation: shake 0.5s ease-in-out infinite; }
        .egg-glow { animation: pulse-glow 2s infinite ease-in-out; }
        .bugsy-pop { animation: bounce-custom 2s infinite ease-in-out; }
        .shadow-blocky { box-shadow: 0px 6px 0px 0px rgba(0, 26, 65, 1); }
        .shadow-pressed { box-shadow: 0px 2px 0px 0px rgba(0, 26, 65, 1); transform: translateY(4px); }
        .terminal-cursor { border-right: 2px solid #00ff00; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            display: inline-block;
            vertical-align: middle;
        }
    </style>

<body class="bg-[#FFE5D9] min-h-screen font-body-md text-on-surface flex flex-col overflow-hidden">
<!-- Top Navigation Bar (Suppressed for focused hatching flow, but title remains) -->
<header class="bg-surface dark:bg-surface-dim border-b-4 border-on-surface dark:border-on-surface-variant shadow-[0px_6px_0px_0px_rgba(0,26,65,1)] flex justify-between items-center w-full px-container-padding py-base top-0 z-10">
<div class="font-display text-display text-primary dark:text-primary-fixed">Bugsy QC</div>
<div class="bg-surface-container-high rounded-full px-4 py-1 border-2 border-on-surface text-ui-button text-primary">
            12 🔥 500 QC 25 BC
        </div>
</header>
<main class="relative flex-grow flex flex-col items-center justify-center p-md overflow-hidden">
<!-- Interior Office Background Context -->
<div class="absolute inset-0 z-0 opacity-40 pointer-events-none">
<!-- Potted Plant (Left) -->
<div class="absolute bottom-20 left-10 w-32 h-48 bg-secondary-container rounded-t-full border-4 border-on-surface flex flex-col items-center justify-end">
<div class="w-16 h-16 bg-on-tertiary-fixed-variant rounded-full -mb-4 border-2 border-on-surface"></div>
</div>
<!-- Sticky Notes Wall (Right) -->
<div class="absolute top-20 right-10 flex flex-col gap-4">
<div class="w-16 h-16 bg-yellow-200 border-2 border-on-surface -rotate-3 p-2 text-[10px]">FIX BUG #402</div>
<div class="w-16 h-16 bg-pink-200 border-2 border-on-surface rotate-6 p-2 text-[10px]">COFFEE TIME</div>
<div class="w-16 h-16 bg-blue-200 border-2 border-on-surface -rotate-12 p-2 text-[10px]">BUG LIST...</div>
</div>
<!-- Lamp (Left Top) -->
<div class="absolute top-10 left-20">
<div class="w-20 h-10 bg-yellow-400 rounded-t-full border-4 border-on-surface"></div>
<div class="w-1 h-20 bg-on-surface mx-auto"></div>
</div>
</div>
<!-- The Hatching Table/Desk -->
<div class="absolute bottom-0 w-full h-1/4 bg-on-secondary-container border-t-8 border-on-surface z-0"></div>
<!-- The Central Interaction -->
<div class="relative z-10 cursor-pointer transition-transform active:scale-95 group" id="hatching-container">
<!-- Sparkle Aura (CSS only) -->
<div class="absolute -inset-10 animate-spin-slow opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-primary text-4xl absolute top-0 left-1/2">spark</span>
<span class="material-symbols-outlined text-tertiary text-4xl absolute bottom-0 left-1/2">spark</span>
<span class="material-symbols-outlined text-secondary text-4xl absolute left-0 top-1/2">spark</span>
<span class="material-symbols-outlined text-primary-container text-4xl absolute right-0 top-1/2">spark</span>
</div>
<!-- The Egg (Initial State) -->
<div class="egg-shake egg-glow w-48 h-64 bg-surface-container-lowest rounded-[100%_100%_80%_80%] border-4 border-on-surface shadow-blocky flex items-center justify-center relative overflow-hidden transition-all duration-500" id="the-egg">
<div class="absolute inset-0 bg-gradient-to-tr from-transparent to-primary/10"></div>
<span class="material-symbols-outlined text-primary text-6xl opacity-30">egg_alt</span>
</div>
<!-- Bugsy (Hidden State) -->
<div class="hidden flex-col items-center" id="bugsy-revealed">
<div class="bugsy-pop relative">
<img alt="Bugsy" class="w-64 h-64 drop-shadow-2xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBa5_tTP_psHB6AiUZYprqVQ9L6rv9CtLwIa35edk7VoOjnr5J4-EExI1hh3kTRX9ZXm42XhTw0fFfsunTxxydSGK0dMMJw6x62zSrjVhVX-lri0gvICPDpxjho7D15u0EWYt_SVsHPiRqhCiGMvxBOj4FNrtEpB4aDfyMh8FRopnjQhJ8dfh2rMrY0_oO7JgjM3guAr4tcl1vSH4BCoOYdUC-NU5dN7LWbsMIpwH9Ua5sTi9DmSC3hgpR85wL5Uitpwu5Fiot0gaIv"/>
<!-- Hatching bits around -->
<div class="absolute -top-4 -left-4 w-12 h-12 bg-surface-container-lowest border-2 border-on-surface rounded-lg -rotate-12"></div>
<div class="absolute top-10 -right-6 w-10 h-10 bg-surface-container-lowest border-2 border-on-surface rounded-full rotate-45"></div>
</div>
</div>

<!-- Notification / Guide Bubble -->

<span class="font-header-lg text-on-surface">Chạm để nở trứng! 🐣</span>
<div class="absolute -top-3 left-1/2 -translate-x-1/2 w-6 h-6 bg-surface border-l-4 border-t-4 border-on-surface rotate-45"></div>
</div>
<!-- Overlay: Name Your Pet Panel -->

<div class="absolute bottom-4 right-4 animate-pulse">
<span class="material-symbols-outlined text-[#00ff00]">edit_note</span>
</div>
</div>

                        Bugsy <span class="material-symbols-outlined text-sm">search</span>
</button>
<button class="bg-surface-variant text-on-surface-variant border-2 border-on-surface rounded-full px-4 py-2 font-ui-button hover:scale-105 active:scale-95 transition-all shadow-[0px_4px_0px_0px_rgba(0,26,65,1)] flex items-center gap-2" onclick="setName('Null')">
                        Null <span class="material-symbols-outlined text-sm">smart_toy</span>
</button>
<button class="bg-secondary-container text-on-secondary-container border-2 border-on-surface rounded-full px-4 py-2 font-ui-button hover:scale-105 active:scale-95 transition-all shadow-[0px_4px_0px_0px_rgba(0,26,65,1)] flex items-center gap-2" onclick="setName('Mèo Prod')">
                        Mèo Prod <span class="material-symbols-outlined text-sm">mood_bad</span>
</button>
</div>
<!-- Main Action Button -->
<button class="w-full bg-primary-container text-on-primary border-4 border-on-surface rounded-full py-4 font-display text-display uppercase shadow-blocky hover:translate-y-1 hover:shadow-pressed active:scale-95 transition-all flex items-center justify-center gap-4" id="confirm-btn">
<span>Xác nhận</span>
<span class="material-symbols-outlined text-4xl">check_circle</span>
</button>
</div>
</div>
</main>
<!-- Bottom Nav (Suppressed for Onboarding/Task Focused) -->
<script>
        const container = document.getElementById('hatching-container');
        const egg = document.getElementById('the-egg');
        const bugsy = document.getElementById('bugsy-revealed');
        const bubble = document.getElementById('guide-bubble');
        const panel = document.getElementById('naming-panel');
        const input = document.getElementById('pet-name-input');
        const confirmBtn = document.getElementById('confirm-btn');

        let clickCount = 0;
        const requiredClicks = 5;

        container.addEventListener('click', () => {
            if (clickCount >= requiredClicks) return;

            clickCount++;
            
            // Intensify shake and glow
            egg.style.animationDuration = `${0.5 / clickCount}s`;
            
            // Random crack visual would be cool, but we stick to state swap for simplicity
            if (clickCount >= requiredClicks) {
                hatch();
            }
        });

        function hatch() {
            egg.classList.add('scale-150', 'opacity-0');
            setTimeout(() => {
                egg.classList.add('hidden');
                bugsy.classList.remove('hidden');
                bubble.classList.add('hidden');
                
                // Slide up naming panel
                panel.classList.remove('translate-y-full');
            }, 500);
        }

        function setName(name) {
            input.value = name;
            input.focus();
        }

        confirmBtn.addEventListener('click', () => {
            if (input.value.trim() === "") {
                input.parentElement.classList.add('border-error');
                setTimeout(() => input.parentElement.classList.remove('border-error'), 1000);
                return;
            }
            
            // Final transition logic
            confirmBtn.innerHTML = '<span>Đang Tải...</span><span class="material-symbols-outlined animate-spin">sync</span>';
            setTimeout(() => {
                alert(`Chào mừng ${input.value} vào đội ngũ QC!`);
                // Proceed to next screen logic would go here
            }, 1000);
        });

        // Add some atmospheric particles logic? 
        // Just keeping it clean for now per requirements.
    </script>
</body></html>
