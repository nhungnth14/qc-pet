name: CI

# Quality gate: chặn PR vào main nếu type-check / lint / config fail.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # cần full history để diff file thay đổi vs base

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm type-check

      - name: Lint (changed files)
        # Lint CHỈ file MỚI/ĐỔI trong PR (log tập trung, không cả đống nợ cũ).
        # TODO(lint-debt): advisory tạm — nợ lint baseline toàn repo (~360 lỗi src của
        # Epic trước + xung khắc convention unicorn/filename-case) chưa dọn. Mirror cách
        # jest/expo-doctor đang continue-on-error. XOÁ continue-on-error để biến lint
        # thành hard-gate sau khi xong story "lint cleanup repo-wide" (deferred-work.md).
        continue-on-error: true
        run: |
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD~1"
          fi
          echo "Diff base: $BASE"
          FILES=$(git diff --name-only --diff-filter=ACMR "$BASE"...HEAD \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|ya?ml|toml)$' || true)
          if [ -z "$FILES" ]; then
            echo "Không có file lint-able nào thay đổi — skip."
            exit 0
          fi
          echo "Lint các file thay đổi:"; printf '%s\n' "$FILES"
          printf '%s\n' "$FILES" | xargs pnpm exec eslint

      - name: Unit tests
        # TODO(harness): jest hiện FAIL do xung đột RN 0.81 + jest-expo mock (lỗi CÓ SẴN
        # từ baseline, KHÔNG phải lỗi của PR — mọi suite đều crash ở module load).
        # continue-on-error tạm để không chặn mọi PR; XOÁ dòng này sau khi fix harness
        # (xem task "Fix broken Jest test harness (RN 0.81 + jest-expo)").
        continue-on-error: true
        run: pnpm test:ci

      - name: Expo config check
        # Validate app.config.ts resolve được (bắt lỗi config/plugin thật). KHÔNG dùng
        # `expo-doctor` làm gate cứng: nó fail trên dep-drift/duplicate-deps CÓ SẴN (không
        # phải lỗi của PR). Chạy `npx expo-doctor` thủ công định kỳ để dọn dependencies.
        run: npx expo config --type public > /dev/null
