name: Content Quality Gate

# Block PR nếu content files vi phạm schema (NFR-3, Story 0-3 + 1-1 + 1-2).
# Covers: lessons (source_tag + full schema), RBOTW (authored_by non-AI), author profiles.
on:
  pull_request:
    paths:
      - 'content/lessons/**'
      - 'content/real-bugs/**'
      - 'content/authors/**'
      - 'content/schemas/**'

permissions:
  contents: read

jobs:
  validate-content:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate all content (lessons + RBOTW + authors)
        run: node scripts/validate-content.mjs
